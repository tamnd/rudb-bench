# The per-commit gate. Everything here is required to merge.
#
# This repository is a harness rather than a library, so the matrix is smaller than the engine's:
# what matters is that it builds and runs where someone would run it, which is Linux for the real
# measurements and macOS for a laptop. Nothing here measures anything on a GitHub runner and it
# never will, because a timing from a shared virtual machine is not a timing. The real runs happen
# on the named instance types in spec/15-rudb-bench.md section 15.4.
#
# What CI does check is that the apparatus still works, which is a different question from what it
# measures. The smoke suite runs here against a pinned DuckDB and the numbers it produces are
# thrown away. A harness nobody exercised for six months is one that does not work on the morning
# somebody needs it, and that morning is always the worst one to find out.
#
# Actions are pinned to a patch version rather than a major tag, so a run can be reproduced.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The newest released DuckDB. Written down rather than resolved to latest, because a comparison
  # whose other side moved on its own is not a measurement.
  DUCKDB_VERSION: v1.5.5

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: test on ${{ matrix.os }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install duckdb
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) asset=duckdb_cli-linux-amd64.zip ;;
            macOS) asset=duckdb_cli-osx-universal.zip ;;
            *) echo "no duckdb build wired up for ${{ runner.os }}" >&2; exit 1 ;;
          esac
          url=https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/$asset
          curl -fsSL --retry 3 -o duckdb.zip "$url"
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "RUDB_BENCH_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/duckdb/duckdb" -version
      - name: cargo test
        run: cargo test --all-features
      # The prose rules are checked by a test, so this is covered above. What is not covered above
      # is that the command line still answers.
      - name: the harness reports its baselines
        run: cargo run -q -- baselines
      # The machine record has to be readable on both platforms, because the fleet is both and a
      # record that only works on Linux is one that quietly stops being taken on the Windows box.
      - name: the machine record reads
        run: cargo run -q -- machine
      # The committed runs still parse and still render. This is the one check that reads a file a
      # person edited by hand, since a run is stored on a server and committed from a laptop, and a
      # ledger that stopped parsing would be noticed on the day somebody went looking for what a
      # layer bought rather than on the commit that broke it.
      - name: the ledger reads its committed runs
        run: cargo run -q -- ledger
      # The whole measurement path, on a runner whose timings mean nothing. What is being checked
      # is that it produces a table, not what is in it.
      #
      # `--check` compares the run against baselines/smoke.txt and fails when a query got twice as
      # slow and left the recorded range behind. There is no record for a GitHub runner in that file
      # and there should not be, since the hardware underneath varies between runs, so this prints
      # the sentence saying it refused to compare and passes. That is the read path being exercised
      # rather than a gate being satisfied, and the output says which of the two it was.
      #
      # It used to compare anyway, against the record from gamingpc-wsl, and q6 is three times
      # slower on a hosted runner than on that desktop, so this step failed on every commit for
      # twelve runs before anybody read the log. tamnd/rudb-bench#122 has the detail. The timing
      # gate that means something is `--check-drift` on a fleet machine, and nothing schedules it
      # yet.
      - name: the smoke suite still measures something
        run: cargo run -q --release -- run smoke --check

  # The plan gate. Milestone E1 asks for committed plan baselines diffed in CI so that a plan change
  # is a reviewed diff rather than something noticed three weeks later in a performance run, and
  # this is the job that makes the second half of that sentence true.
  #
  # It is the only job here that needs rudb, and the only one that measures nothing at all. A plan
  # needs a schema and no rows, so it runs against the zero row Parquet files in fixtures/, which
  # are 36 KB for every suite that has them. Nothing is timed and nothing here would mean anything
  # if it were.
  #
  # rudb is pinned to a tag for the same reason DuckDB above is: a check whose other side moved on
  # its own is not a check. Bumping RUDB_VERSION and re-recording the baselines is one reviewed pull
  # request, and that pull request is where a plan change gets looked at, which is what the
  # milestone asked for. The cost of the pin is that a plan change in rudb is caught when the pin
  # moves rather than on the commit that made it, and the engine's own nightly job calls these
  # subcommands by name, which is where it gets caught sooner.
  plans:
    name: plan baselines
    needs: quick
    runs-on: ubuntu-24.04
    env:
      RUDB_VERSION: v0.3.40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rudb
          ref: ${{ env.RUDB_VERSION }}
          path: rudb
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Its own cache, keyed off the pinned tag. Sharing one with the jobs above would mean the
          # engine's dependency tree evicting the harness's on every run.
          key: rudb-${{ env.RUDB_VERSION }}
          workspaces: |
            .
            rudb
      - name: build the pinned rudb
        working-directory: rudb
        # The shell binary and not the workspace, because the plan gate drives rudb the same way
        # every other subcommand does, through the command line. A debug build, because nothing
        # here is timed and a release build of thirty three crates would be minutes spent making a
        # binary that prints the same plan.
        run: cargo build -p rudb-cli --bin rudb
      - name: every plan is the one that was written down
        env:
          RUDB_BENCH_RUDB: ${{ github.workspace }}/rudb/target/debug/rudb
        run: cargo run -q -- plans
      # Milestone G0 asks for a zero that costs nothing, which means the two rules it adds have to
      # be switchable and have to leave every plan alone while they are off. The gate above says
      # what the plans are and this one says the rules had nothing to do with them. It plans each
      # suite twice, once with the rule on and once with it off, and it passes when the two are the
      # same plan. A rule that moves a plan here is either doing work it claims not to do or the
      # plan is reading something other than the rule, and both of those are the milestone failing.
      - name: the G0 rules move no plan
        env:
          RUDB_BENCH_RUDB: ${{ github.workspace }}/rudb/target/debug/rudb
        run: |
          cargo run -q -- plans --ablate statistics
          cargo run -q -- plans --ablate graph_sections

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo doc --all-features --no-deps

  ci:
    name: ci
    if: always()
    needs: [quick, test, plans, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
